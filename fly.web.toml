app = "planify-kids-web"
primary_region = "cdg"

[build]
  dockerfile = "docker/web.prod.Dockerfile"

[env]
  # Fly.io private networking — resolves to planify-kids-api internal IP
  API_URL = "http://planify-kids-api.internal:3000"

[[services]]
  internal_port = 80
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [services.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"
    protocol = "http"
