name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @planify-kids/api db:generate
        env:
          DATABASE_URL: postgresql://localhost/ci_dummy

      - name: Typecheck API
        run: pnpm --filter @planify-kids/api typecheck

      - name: Test API
        run: pnpm --filter @planify-kids/api test

  smoke:
    name: API — smoke test (startup + /health)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planify_kids
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/planify_kids
      MONGODB_URI: mongodb://localhost:27017/planify-kids-ci
      JWT_SECRET: ci-secret-min-32-chars-for-testing-only
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @planify-kids/api db:generate

      - name: Push schema
        run: pnpm --filter @planify-kids/api db:push

      - name: Start API (background)
        run: |
          pnpm --filter @planify-kids/api dev &
          echo $! > /tmp/api.pid

      - name: Wait for API + health check
        run: |
          for i in $(seq 1 15); do
            sleep 2
            if curl -sf http://localhost:3000/health; then
              echo "✅ API healthy"
              exit 0
            fi
            echo "Attempt $i/15..."
          done
          echo "❌ API did not start in time"
          cat /tmp/api.pid | xargs kill 2>/dev/null || true
          exit 1

  web:
    name: Web — typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Web
        run: pnpm --filter @planify-kids/web typecheck

      - name: Tests Web (unitaires)
        run: pnpm --filter @planify-kids/web test

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [api, smoke, web]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planify_kids
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/planify_kids
      MONGODB_URI: mongodb://localhost:27017/planify-kids-e2e
      JWT_SECRET: ci-secret-min-32-chars-for-testing-only
      PORT: "3000"
      BASE_URL: "http://localhost:4173"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @planify-kids/api db:generate

      - name: Push schema
        run: pnpm --filter @planify-kids/api db:push

      - name: Seed demo data
        run: pnpm --filter @planify-kids/api db:seed

      - name: Start API (background)
        run: |
          pnpm --filter @planify-kids/api dev &
          echo $! > /tmp/api.pid

      - name: Wait for API
        run: |
          for i in $(seq 1 15); do
            sleep 2
            if curl -sf http://localhost:3000/health; then echo "✅ API up"; break; fi
            echo "Attempt $i/15..."
          done

      - name: Build web
        run: pnpm --filter @planify-kids/web build

      - name: Start web preview (background)
        run: |
          pnpm --filter @planify-kids/web preview &
          echo $! > /tmp/web.pid

      - name: Wait for web
        run: |
          for i in $(seq 1 10); do
            sleep 2
            if curl -sf http://localhost:4173; then echo "✅ Web up"; break; fi
            echo "Attempt $i/10..."
          done

      - name: Install Playwright browsers
        run: pnpm --filter @planify-kids/web exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm --filter @planify-kids/web e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Déploiement géré par Netlify via son intégration GitHub native.
  # Chaque push sur main déclenche automatiquement un deploy Netlify.
  # Pas de job CI nécessaire ici.
