app = "planify-kids-web"
primary_region = "cdg"

[build]
  dockerfile = "docker/web.prod.Dockerfile"

[env]
  # Fly.io private networking — resolves to planify-kids-api internal IP
  API_URL = "http://planify-kids-api.internal:3000"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
